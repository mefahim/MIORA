<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" fill="none">
  <defs>
    <radialGradient id="og-glow" cx="80%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#009587" stop-opacity="0.3"/>
      <stop offset="70%" stop-color="#080B10" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#D1D5DB"/>
    </linearGradient>
    <linearGradient id="brand-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#26A69A"/>
      <stop offset="100%" stop-color="#009587"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#0A0D14"/>
  <rect width="1200" height="630" fill="url(#og-glow)"/>

  <!-- Subtle grid pattern -->
  <g opacity="0.08" stroke="#FFFFFF" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- Brand Squircle Logo -->
  <g transform="translate(100, 100)">
    <rect width="80" height="80" rx="22" fill="#131924" stroke="url(#brand-grad)" stroke-width="2.5"/>
    <rect x="20" y="32" width="6" height="26" rx="3" fill="url(#brand-grad)"/>
    <rect x="31" y="20" width="6" height="42" rx="3" fill="url(#brand-grad)"/>
    <circle cx="44" cy="40" r="3.5" fill="#80CBC4"/>
    <rect x="51" y="20" width="6" height="42" rx="3" fill="url(#brand-grad)"/>
    <rect x="62" y="32" width="6" height="26" rx="3" fill="url(#brand-grad)"/>
  </g>

  <!-- Badge -->
  <rect x="205" y="122" width="168" height="36" rx="18" fill="#142426" stroke="#009587" stroke-width="1.5"/>
  <circle cx="225" cy="140" r="5" fill="#26A69A"/>
  <text x="240" y="146" fill="#80CBC4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" letter-spacing="1">PUBLIC BETA v0.1.0</text>

  <!-- Main Headline -->
  <text x="100" y="280" fill="url(#text-grad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="800" letter-spacing="-1.5">Your music. Your moments.</text>

  <!-- Subtitle -->
  <text x="100" y="340" fill="#9CA3AF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="400">A personal Android music player designed to make every listening moment feel effortless.</text>

  <!-- Feature Pills -->
  <g transform="translate(100, 420)">
    <rect x="0" y="0" width="180" height="46" rx="12" fill="#131924" stroke="rgba(255,255,255,0.08)"/>
    <text x="20" y="29" fill="#E5E7EB" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="500">✨ Offline First</text>

    <rect x="200" y="0" width="220" height="46" rx="12" fill="#131924" stroke="rgba(255,255,255,0.08)"/>
    <text x="220" y="29" fill="#E5E7EB" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="500">🎨 Dynamic Palette</text>

    <rect x="440" y="0" width="220" height="46" rx="12" fill="#131924" stroke="rgba(255,255,255,0.08)"/>
    <text x="460" y="29" fill="#E5E7EB" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="500">🛡️ In-App Updates</text>
  </g>

  <!-- Clean room badge bottom -->
  <text x="100" y="555" fill="#6B7280" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16">Clean-room independent Android project • Free &amp; Open Source • Apache 2.0</text>
</svg>
