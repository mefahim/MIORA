<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <defs>
    <linearGradient id="miora-grad" x1="10%" y1="10%" x2="90%" y2="90%">
      <stop offset="0%" stop-color="#26A69A"/>
      <stop offset="50%" stop-color="#009587"/>
      <stop offset="100%" stop-color="#00695C"/>
    </linearGradient>
    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#80CBC4" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#004D40" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="m-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background squircle -->
  <rect x="8" y="8" width="104" height="104" rx="28" fill="#121721" stroke="url(#miora-grad)" stroke-width="2.5"/>

  <!-- Soundwave 'M' monogram -->
  <!-- Bar 1 (Left vertical) -->
  <rect x="28" y="44" width="8" height="36" rx="4" fill="url(#miora-grad)"/>
  
  <!-- Bar 2 (Left diagonal peak) -->
  <rect x="42" y="30" width="8" height="58" rx="4" fill="url(#miora-grad)"/>
  
  <!-- Center pulse / frequency node -->
  <circle cx="60" cy="56" r="5" fill="#80CBC4" filter="url(#m-glow)"/>
  
  <!-- Bar 3 (Right diagonal peak) -->
  <rect x="70" y="30" width="8" height="58" rx="4" fill="url(#miora-grad)"/>
  
  <!-- Bar 4 (Right vertical) -->
  <rect x="84" y="44" width="8" height="36" rx="4" fill="url(#miora-grad)"/>

  <!-- Dynamic audio arc -->
  <path d="M32 26 C48 18, 72 18, 88 26" stroke="#26A69A" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="2 4"/>
</svg>
