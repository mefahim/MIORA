<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600" fill="none">
  <defs>
    <radialGradient id="h-bg" cx="40%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#1A2D3A"/>
      <stop offset="60%" stop-color="#0E1924"/>
      <stop offset="100%" stop-color="#070C12"/>
    </radialGradient>
    <linearGradient id="h-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#26A69A"/>
      <stop offset="50%" stop-color="#00897B"/>
      <stop offset="100%" stop-color="#1E3A8A"/>
    </linearGradient>
    <radialGradient id="sun-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#80CBC4"/>
      <stop offset="40%" stop-color="#26A69A"/>
      <stop offset="80%" stop-color="#004D40"/>
      <stop offset="100%" stop-color="#004D40" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Deep Canvas -->
  <rect width="600" height="600" rx="36" fill="url(#h-bg)"/>

  <!-- Ambient Light Orb -->
  <circle cx="340" cy="240" r="180" fill="url(#sun-grad)" opacity="0.65"/>
  <circle cx="220" cy="380" r="140" fill="#1E3A8A" opacity="0.45"/>

  <!-- Geometric Sound Rings -->
  <circle cx="300" cy="300" r="210" stroke="url(#h-glow)" stroke-width="1.5" stroke-dasharray="6 8" opacity="0.4"/>
  <circle cx="300" cy="300" r="160" stroke="#80CBC4" stroke-width="2" opacity="0.5"/>
  <circle cx="300" cy="300" r="110" stroke="#26A69A" stroke-width="3" opacity="0.7"/>

  <!-- Curved Horizon Waves -->
  <path d="M0 430 C150 370, 320 480, 600 400 L600 600 L0 600 Z" fill="#0C1A27" opacity="0.8"/>
  <path d="M0 480 C180 430, 360 520, 600 460 L600 600 L0 600 Z" fill="#07111A"/>

  <!-- Center Vinyl Stylized Core -->
  <circle cx="300" cy="300" r="42" fill="#090D13" stroke="#26A69A" stroke-width="3"/>
  <circle cx="300" cy="300" r="14" fill="#80CBC4"/>
</svg>
